<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 150">
  <rect x="8" y="8" width="304" height="134" rx="12" fill="#ffffff" stroke="#e3e3e3"/>
  <text x="16" y="40" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#333333">Palette</text>
  <rect x="16" y="60" width="34" height="34" rx="9">
    <animate attributeName="fill" values="#ff8c00;#ffd54f;#4caf50;#4285f4;#9c5de5;#808080;#ff8c00" dur="7s" begin="0s" repeatCount="indefinite"/>
  </rect>
  <rect x="58" y="60" width="34" height="34" rx="9">
    <animate attributeName="fill" values="#ffd54f;#4caf50;#4285f4;#9c5de5;#808080;#ff8c00;#ffd54f" dur="7s" begin="0.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="100" y="60" width="34" height="34" rx="9">
    <animate attributeName="fill" values="#4caf50;#4285f4;#9c5de5;#808080;#ff8c00;#ffd54f;#4caf50" dur="7s" begin="0.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="142" y="60" width="34" height="34" rx="9">
    <animate attributeName="fill" values="#4285f4;#9c5de5;#808080;#ff8c00;#ffd54f;#4caf50;#4285f4" dur="7s" begin="0.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="184" y="60" width="34" height="34" rx="9">
    <animate attributeName="fill" values="#9c5de5;#808080;#ff8c00;#ffd54f;#4caf50;#4285f4;#9c5de5" dur="7s" begin="0.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="226" y="60" width="34" height="34" rx="9">
    <animate attributeName="fill" values="#808080;#ff8c00;#ffd54f;#4caf50;#4285f4;#9c5de5;#808080" dur="7s" begin="1s" repeatCount="indefinite"/>
  </rect>
  <text x="16" y="120" font-family="system-ui, sans-serif" font-size="11" fill="#8a8a8a">orange · light yellow · green · blue · purple · gray</text>
  <text x="16" y="136" font-family="system-ui, sans-serif" font-size="11" fill="#8a8a8a">each in normal and light</text>
</svg>
