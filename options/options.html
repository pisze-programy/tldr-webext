<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Quick Read — Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <h1>Quick Read</h1>
    <p class="hint" id="modelHint"></p>
    <p class="hint">
      Your API key is stored in this browser's extension storage and is only read by the background script.
    </p>
    <label for="apiKey">DeepSeek API key</label>
    <input id="apiKey" type="password" autocomplete="off" spellcheck="false" />
    <button id="save" type="button">Save</button>
    <p id="status" class="status"></p>

    <h2>Relaxed markers</h2>
    <div class="marker-group">
      <label for="paletteToggle">Palette</label>
      <div class="palette-picker">
        <button type="button" id="paletteToggle" class="palette-toggle">
          <span class="swatch" id="paletteCurrentChip"></span>
          <span id="paletteCurrentName">Orange</span>
          <span class="caret">&#9662;</span>
        </button>
        <div class="palette-menu" id="paletteMenu" hidden>
          <div class="palette-grid" id="paletteGrid"></div>
        </div>
      </div>

      <label for="markStyle">Marker style</label>
      <select id="markStyle">
        <option value="marker">Background marker</option>
        <option value="sweep">Sweep (left to right)</option>
        <option value="underline">Underline</option>
      </select>

      <label for="markDirection">Shading direction</label>
      <select id="markDirection">
        <option value="strong">Higher weight = stronger</option>
        <option value="inverse">Higher weight = lighter</option>
      </select>
    </div>

    <h2>Reading font</h2>
    <label for="fontFamily">Font for article, summary, fast and relaxed</label>
    <select id="fontFamily">
      <option value="jetbrains">JetBrains Mono</option>
      <option value="none">None (keep page style)</option>
    </select>

    <h2>Usage</h2>
    <p id="totals" class="totals"></p>
    <button id="clearUsage" type="button">Clear log</button>
    <table id="usageTable">
      <thead>
        <tr>
          <th>Date</th>
          <th>Host</th>
          <th>Mode</th>
          <th>Input</th>
          <th>Output</th>
          <th>Reason</th>
          <th>Cost</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <script src="../config.js"></script>
    <script src="options.js"></script>
  </body>
</html>
